# Builds TopTick on pushes to main, on pull requests and on manual runs; the installers are kept
# as workflow artifacts on the run page. Pushing a tag like v0.1.3 builds that version (taken from
# the tag) and publishes the installers to the GitHub Release for the tag, creating it if needed.
# All builds are unsigned.
name: build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple-silicon runner; dist:mac builds separate arm64 and x64 (Intel) .dmg and .zip.
          - os: macos-latest
            dist: mac
            label: macOS
            # Default @electron/get cache (env-paths), used by electron's postinstall and by
            # electron-builder. Neither reads an ELECTRON_CACHE variable.
            electron-cache: ~/Library/Caches/electron
          # x64 NSIS installer.
          - os: windows-latest
            dist: win
            label: Windows
            electron-cache: ~/AppData/Local/electron/Cache
    runs-on: ${{ matrix.os }}
    env:
      # Unsigned builds: stop electron-builder from looking for a signing identity.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # electron-builder's tool downloads (dmgbuild, 7zip, NSIS). Outside the packaged files
      # (electron-builder.yml packs only out/** and package.json).
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Electron and electron-builder downloads come from GitHub releases, which can time out
      # (HTTP 504). Restored before npm ci (electron's postinstall downloads Electron) and before
      # the version step changes package-lock.json on tag builds, so tag and main share the key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ matrix.electron-cache }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm ci
      - name: Set the version
        id: version
        shell: bash
        # On a v* tag the version comes from the tag and is written to package.json (not
        # committed), so the app and the file names match the tag. Other runs keep package.json.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
            if [[ ! "$version" =~ $semver ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not a version tag like v1.2.3"
              exit 1
            fi
            npm version "$version" --no-git-tag-version --allow-same-version
          else
            version="$(node -p "require('./package.json').version")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building TopTick $version"
      - run: npm run typecheck
      - run: npm test
      - name: Package
        shell: bash
        env:
          DIST: ${{ matrix.dist }}
        # The release job publishes; electron-builder must not. Up to 3 attempts, 30 s and 90 s
        # apart, for transient download failures; release/ is cleared before each retry.
        run: |
          delays=(30 90)
          attempt=1
          while true; do
            if npm run "dist:$DIST" -- --publish never; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "::error::Packaging failed after $attempt attempts (exit $status)"
              exit "$status"
            fi
            delay="${delays[attempt - 1]}"
            echo "::warning::Packaging attempt $attempt failed (exit $status); retrying in ${delay}s"
            rm -rf release
            sleep "$delay"
            attempt=$((attempt + 1))
          done
      - name: Check the installers
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST: ${{ matrix.dist }}
        run: |
          if [ "$DIST" = mac ]; then
            files="mac-arm64.dmg mac-arm64.zip mac-x64.dmg mac-x64.zip"
          else
            files="win-x64-setup.exe"
          fi
          for f in $files; do
            if [ ! -f "release/TopTick-$VERSION-$f" ]; then
              echo "::error::Missing release/TopTick-$VERSION-$f"
              ls release
              exit 1
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TopTick-${{ steps.version.outputs.version }}-${{ matrix.label }}
          path: |
            release/TopTick-${{ steps.version.outputs.version }}-mac-*.dmg
            release/TopTick-${{ steps.version.outputs.version }}-mac-*.zip
            release/TopTick-${{ steps.version.outputs.version }}-win-x64-setup.exe
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages
          pattern: TopTick-*
          merge-multiple: true
      - name: Publish to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Uploads into the release when it already exists (for example one created on the web),
        # replacing files with the same name; otherwise creates it.
        run: |
          version="${GITHUB_REF_NAME#v}"
          files=()
          for f in mac-arm64.dmg mac-arm64.zip mac-x64.dmg mac-x64.zip win-x64-setup.exe; do
            path="packages/TopTick-$version-$f"
            if [ ! -f "$path" ]; then
              echo "::error::Missing $path"
              ls packages
              exit 1
            fi
            files+=("$path")
          done
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "TopTick $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
