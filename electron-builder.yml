appId: com.toptick.app
productName: TopTick
copyright: Copyright (c) 2026 Duc Tran
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
electronLanguages:
  - en
  - vi
# The tray icon is loaded from process.resourcesPath in the packaged app (src/main/tray.ts).
extraResources:
  - from: build/trayTemplate.png
    to: trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: trayTemplate@2x.png
  - from: build/tray.ico
    to: tray.ico
mac:
  target:
    - dmg
    - zip
  # Separate Apple-silicon and Intel files instead of one universal app (twice the size).
  # The arch is always in the name; electron-builder leaves it out for x64 by default.
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  category: public.app-category.finance
  # Unsigned: no Developer ID certificate.
  identity: null
  extendInfo:
    LSUIElement: true
dmg:
  # bzip2 instead of the default zlib (UDZO): about 10 MB smaller; the first mount verifies a
  # few seconds longer. Supported on every macOS that Electron runs on.
  format: UDBZ
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  # No spaces: GitHub turns spaces in Release asset names into dots.
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
  oneClick: true
  perMachine: false
