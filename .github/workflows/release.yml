# Builds TopTick on pushes to main and on pull requests. Pushing a tag like v0.1.0 also publishes
# a GitHub Release for that tag with the packages attached. All builds are unsigned.
name: build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple-silicon runner; dist:mac builds separate arm64 and x64 (Intel) .dmg and .zip.
          - os: macos-latest
            dist: mac
          # x64 NSIS installer.
          - os: windows-latest
            dist: win
    runs-on: ${{ matrix.os }}
    env:
      # Unsigned builds: stop electron-builder from looking for a signing identity.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Package
        # The release job publishes; electron-builder must not.
        run: npm run dist:${{ matrix.dist }} -- --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toptick-${{ matrix.dist }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages
          merge-multiple: true
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" packages/*
          --repo "$GITHUB_REPOSITORY"
          --title "TopTick $GITHUB_REF_NAME"
          --generate-notes
